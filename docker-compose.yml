# docker-compose.yml
#
# Sobe o site (web) e a API em containers, com hot reload.
# O banco (Supabase + Postgres) roda em containers próprios, gerenciados
# pela CLI do Supabase:  npm run db:start
# O app de celular roda fora do Docker, com o Expo:  npm run mobile
#
# Uso:  docker compose up --build     (ou: npm run dev)

services:
  api:
    build:
      context: . # raiz do repositório, para enxergar packages/shared
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: psi-tracker-api
    ports:
      - '3333:3333'
    environment:
      NODE_ENV: development
      API_PORT: 3333
      WEB_APP_URL: http://localhost:5173
      # Dentro do container, "localhost" é o próprio container.
      # host.docker.internal aponta para o SEU computador, onde o Supabase está rodando.
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Defina SUPABASE_PUBLISHABLE_KEY no arquivo .env}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # Espelha seu código dentro do container: salvou no VS Code, a API reinicia
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3333/api/health']
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: psi-tracker-web
    ports:
      - '5173:5173'
    environment:
      # Estas URLs são acessadas pelo SEU navegador, por isso usam localhost
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Defina SUPABASE_PUBLISHABLE_KEY no arquivo .env}
      VITE_API_URL: http://localhost:3333/api
      WATCH_WITH_POLLING: 'true'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      api:
        condition: service_healthy
